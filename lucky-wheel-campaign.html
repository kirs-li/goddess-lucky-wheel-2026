<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>女神归来 · 幸运大转盘</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;background:#000;color:#f5e6c4;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:0;background:
      radial-gradient(120% 60% at 50% -8%, rgba(96,58,8,.55) 0%, rgba(0,0,0,0) 62%),
      radial-gradient(100% 55% at 50% 115%, rgba(74,42,5,.5) 0%, rgba(0,0,0,0) 60%),
      radial-gradient(60% 40% at 50% 42%, rgba(60,32,4,.35) 0%, rgba(0,0,0,0) 70%),
      #040201;}
  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px 16px 28px;
        display:flex;flex-direction:column;align-items:center}
  .goldtxt{background:linear-gradient(180deg,#fff6cf 0%,#f4d98a 34%,#d9a441 62%,#a9711f 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent;
        -webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
  .t1{font-size:50px;font-weight:900;letter-spacing:10px;margin-top:4px;text-indent:10px}
  .t2{font-size:22px;color:#ffe9b0;letter-spacing:6px;margin-top:2px;text-shadow:0 0 14px rgba(233,166,40,.55)}
  .ribbon{margin-top:10px;padding:6px 22px;border-radius:999px;
        background:linear-gradient(180deg,#e0453f,#b01019 60%,#8c0c14);
        box-shadow:0 4px 14px rgba(176,16,25,.45), inset 0 1px 0 rgba(255,255,255,.28);
        color:#ffe9b0;font-size:17px;font-weight:700;letter-spacing:3px;text-indent:3px;
        border:1px solid #e9a62888}
  .wheelbox{position:relative;width:min(88vw,356px);height:min(88vw,356px);margin:16px auto 0}
  .wheel{position:absolute;inset:6px;transition:transform 4.6s cubic-bezier(.13,.66,.06,1);
        will-change:transform;filter:drop-shadow(0 8px 22px rgba(233,166,40,.28))}
  .wheel svg{width:100%;height:100%;display:block}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:5;
        width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;
        border-top:36px solid #f4c15c;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
  .pointer::after{content:"";position:absolute;top:-42px;left:-19px;width:0;height:0;
        border-left:19px solid transparent;border-right:19px solid transparent;
        border-top:36px solid #b01019}
  .pointer::before{content:"";position:absolute;top:-39px;left:-13px;width:0;height:0;z-index:2;
        border-left:13px solid transparent;border-right:13px solid transparent;
        border-top:24px solid #f6d98e}
  .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;
        width:31%;height:31%;border-radius:50%;display:flex;flex-direction:column;
        align-items:center;justify-content:center;cursor:pointer;user-select:none;
        background:radial-gradient(circle at 35% 30%,#fff3c0,#eec25c 45%,#b8860b 80%,#8a6409);
        border:3px solid #8a6409;box-shadow:0 0 0 5px #f6d98e66, 0 6px 16px rgba(0,0,0,.6), inset 0 -4px 10px rgba(0,0,0,.35);
        color:#4a2e00;font-weight:900;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.045)}}
  .hub .big{font-size:26px;line-height:1.05;text-shadow:0 1px 0 #fff3c0}
  .hub .sml{font-size:10px;letter-spacing:2px;opacity:.85;margin-top:2px}
  .hub.off{opacity:.7;pointer-events:none}
  .legend{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .panel{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;
        background:linear-gradient(180deg,rgba(64,36,6,.92),rgba(22,12,3,.94));
        border:1px solid rgba(217,164,65,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .chip{flex:0 0 auto;padding:4px 10px;border-radius:8px;font-size:14px;font-weight:900;
        color:#3a2200;background:linear-gradient(180deg,#ffe9ae,#e9a628 55%,#b8860b);
        box-shadow:0 2px 5px rgba(0,0,0,.5)}
  .chip.c4{background:linear-gradient(180deg,#e8d8b0,#c9ab6b 55%,#9c7f42);color:#4a3410}
  .pinfo{min-width:0}
  .pname{font-size:15px;font-weight:700;color:#ffe9b0;white-space:nowrap}
  .pdesc{font-size:11px;color:#b99a62;margin-top:2px}
  .note{margin-top:14px;text-align:center;font-size:12px;color:#8a6a35;line-height:1.9}
  .note b{color:#c9a25f;font-weight:600}
  .mask{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);
        display:none;align-items:center;justify-content:center;padding:24px}
  .mask.show{display:flex}
  .card{width:min(86vw,400px);border-radius:20px;padding:28px 24px 24px;text-align:center;
        background:radial-gradient(120% 90% at 50% 0%,#3a2407,#0c0602 70%);
        border:1.5px solid #d9a441;box-shadow:0 0 0 6px rgba(217,164,65,.15), 0 18px 50px rgba(0,0,0,.8);
        position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:-70px;left:50%;transform:translateX(-50%);
        width:340px;height:140px;border-radius:50%;background:rgba(233,166,40,.25);filter:blur(30px)}
  .card .hi{font-size:17px;color:#caa96a;letter-spacing:6px;position:relative}
  .card .lv{font-size:44px;font-weight:900;margin:10px 0 2px;position:relative}
  .card .pz{font-size:20px;font-weight:700;color:#fff0c8;position:relative}
  .card .tip{margin:14px 0 4px;font-size:13px;color:#b99a62;line-height:1.8;position:relative}
  .card .btn{margin-top:14px;display:inline-block;padding:11px 0;width:100%;border-radius:999px;
        background:linear-gradient(180deg,#eec25c,#b8860b);color:#3a2200;font-size:16px;font-weight:700;
        letter-spacing:2px;cursor:pointer;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .card .btn.ghost{background:transparent;color:#caa96a;border:1px solid rgba(217,164,65,.5);box-shadow:none;font-weight:400}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="t1 goldtxt">女神归来</div>
  <div class="t2">寻找最美代言人</div>
  <div class="ribbon">100%中奖 · 到院领取千元好礼</div>

  <div class="wheelbox">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"><svg id="svg" viewBox="0 0 360 360"></svg></div>
    <div class="hub" id="btn"><div class="big">抽奖</div><div class="sml">GO</div></div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="note">
    活动规则:点击抽奖,100%中奖,<b>不限次数、可重复参与</b>;中奖后请<b>保留本页面</b>,到店出示核销。<br>
    所有奖品均由主办方提供 · 本活动最终解释权归主办方所有
  </div>
</div>

<div class="mask" id="mask">
  <div class="card">
    <div class="hi" id="m-hi">恭 喜 中 奖</div>
    <div class="lv goldtxt" id="m-lv"></div>
    <div class="pz" id="m-pz"></div>
    <div class="tip" id="m-tip"></div>
    <div class="btn" id="copyBtn">复制中奖信息</div>
    <div class="btn ghost" onclick="closeModal()">知道了</div>
  </div>
</div>

<script>
(function(){
  var P=[
    {lv:"一等奖", name:"29800项目大礼包", short:"29800礼包", detail:"价值29800元项目大礼包(到院核销使用)"},
    {lv:"二等奖", name:"轻奢护理项目大礼包", short:"轻奢礼包", detail:"轻奢护理项目大礼包一套(到院核销使用)"},
    {lv:"三等奖", name:"品牌香水1瓶", short:"品牌香水", detail:"品牌香水1瓶(到院核销领取)"},
    {lv:"四等奖", name:"到店体验项目", short:"到店体验", detail:"到店体验项目1次(到院核销体验)"}
  ];
  var SEC=[3,0,3,1,3,2,3,1];          // 8格:一等奖x1 二等奖x2 三等奖x1 四等奖x4
  var SP=360/SEC.length;
  var CX=180, CY=180, R=172;

  // 目标奖级:?award=first|fourth(旧入口)或 ?p=1..4;缺省=四等奖
  var q=new URLSearchParams(location.search);
  var awardMap={first:0,second:1,third:2,fourth:3};
  var tIdx = q.get('award')!=null ? awardMap[q.get('award')] : (parseInt(q.get('p'),10)||4)-1;
  if(tIdx==null||tIdx<0||tIdx>3) tIdx=3;
  var targetPrize=tIdx;

  var auto = q.get('auto')==='1';
  var Rtot=0, spinning=false;

  // ---------- 绘制转盘 ----------
  var FILL=[["#B01E23","#fff3c8"],["#D9A441","#4a2a00"]];
  var ns="http://www.w3.org/2000/svg";
  var svg=document.getElementById('svg');
  var g=document.createElementNS(ns,'g');
  for(var i=0;i<SEC.length;i++){
    var a0=-90+i*SP, a1=a0+SP;
    var x0=CX+R*Math.cos(a0*Math.PI/180), y0=CY+R*Math.sin(a0*Math.PI/180);
    var x1=CX+R*Math.cos(a1*Math.PI/180), y1=CY+R*Math.sin(a1*Math.PI/180);
    var path=document.createElementNS(ns,'path');
    path.setAttribute('d','M'+CX+','+CY+' L'+x0.toFixed(2)+','+y0.toFixed(2)+' A'+R+','+R+' 0 0 1 '+x1.toFixed(2)+','+y1.toFixed(2)+' Z');
    var tone=FILL[i%2];
    path.setAttribute('fill',tone[0]);
    path.setAttribute('stroke','rgba(255,215,130,.35)');
    path.setAttribute('stroke-width','1');
    g.appendChild(path);
    var mid=(a0+a1)/2*Math.PI/180, tone2=FILL[i%2][1];
    var pz=P[SEC[i]];
    var lines=[pz.lv,pz.short];
    var radii=[R*0.53,R*0.68];
    for(var k=0;k<2;k++){
      var d=radii[k];
      var tx=CX+d*Math.sin(mid), ty=CY-d*Math.cos(mid);
      var t=document.createElementNS(ns,'text');
      t.setAttribute('x',tx.toFixed(1)); t.setAttribute('y',ty.toFixed(1));
      t.setAttribute('text-anchor','middle');
      t.setAttribute('fill',tone2);
      t.setAttribute('font-family','"Microsoft YaHei",sans-serif');
      t.setAttribute('font-size', k===0?15:10.5);
      t.setAttribute('font-weight', k===0?'bold':'normal');
      t.textContent=lines[k];
      g.appendChild(t);
    }
  }
  var ring=document.createElementNS(ns,'circle');
  ring.setAttribute('cx',CX);ring.setAttribute('cy',CY);ring.setAttribute('r',R-1);
  ring.setAttribute('fill','none');ring.setAttribute('stroke','#f4c15c');ring.setAttribute('stroke-width','5');
  g.appendChild(ring);
  var inr=document.createElementNS(ns,'circle');
  inr.setAttribute('cx',CX);inr.setAttribute('cy',CY);inr.setAttribute('r','44');
  inr.setAttribute('fill','#2a1605');inr.setAttribute('stroke','#d9a441');inr.setAttribute('stroke-width','2.5');
  g.appendChild(inr);
  svg.appendChild(g);

  // ---------- 奖级图例 ----------
  var legend=document.getElementById('legend'), h='';
  for(var j=0;j<4;j++){
    h+='<div class="panel"><div class="chip'+(j===3?' c4':'')+'">'+
       P[j].lv+'</div><div class="pinfo"><div class="pname">'+P[j].name+
       '</div><div class="pdesc">'+P[j].detail+'</div></div></div>';
  }
  legend.innerHTML=h;

  // ---------- 抽奖 ----------
  function pickSector(){
    var cands=[];
    for(var i=0;i<SEC.length;i++) if(SEC[i]===targetPrize) cands.push(i);
    return cands[Math.floor(Math.random()*cands.length)];
  }
  function mod360(a){return ((a%360)+360)%360;}
  function claimInfo(pz){ return '【女神归来·寻找最美代言人】我抽中了'+pz.lv+'('+pz.name+'),凭此信息到店核销领取。'; }
  function showResult(pz){
    document.getElementById('m-hi').textContent = '恭 喜 中 奖';
    document.getElementById('m-lv').textContent = pz.lv;
    document.getElementById('m-pz').textContent = pz.name;
    document.getElementById('m-tip').innerHTML = '恭喜您抽中<b>'+pz.lv+'</b>!<br>请保留本页面,凭手机到店出示核销领取。<br><span style="color:#8a6a35">奖品以到店核销为准,有效期以门店告知为准。</span>';
    document.getElementById('mask').classList.add('show');
  }
  document.getElementById('copyBtn').addEventListener('click',function(){
    var txt = claimInfo({lv:document.getElementById('m-lv').textContent,name:document.getElementById('m-pz').textContent});
    function done(){ this.textContent='已复制,去微信粘贴'; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done.bind(this)).catch(function(){ fallback(txt); });
    } else { fallback(txt); }
    function fallback(t){
      var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta); done.call(document.getElementById('copyBtn'));
    }
  });
  window.closeModal=function(){
    document.getElementById('mask').classList.remove('show');
    document.getElementById('btn').classList.remove('off');
  };
  function spin(){
    if(spinning) return;
    spinning=true;
    document.getElementById('btn').classList.add('off');
    var i=pickSector();
    var phase=mod360(360-(i+0.5)*SP);
    var need=Rtot+1440;
    var R1=need+mod360(phase-mod360(need));
    var wheel=document.getElementById('wheel');
    wheel.style.transition= auto?'none':'transform 4.6s cubic-bezier(.13,.66,.06,1)';
    wheel.style.transform='rotate('+R1+'deg)';
    Rtot=R1;
    setTimeout(function(){
      var pz=P[SEC[i]];
      spinning=false;
      document.title='LANDED:'+pz.lv+':'+pz.name;
      if(!auto){
        document.getElementById('btn').classList.remove('off');
        showResult(pz);
      }
    }, auto?150:4800);
  }
  document.getElementById('btn').addEventListener('click',spin);
  if(auto) setTimeout(spin,500);
})();
</script>
</body>
</html>
